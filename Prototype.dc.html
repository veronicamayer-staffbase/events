<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#FAFAFC;font-family:Inter,sans-serif}
  a{color:#FF6840;text-decoration:none}
  .stripe{background-image:repeating-linear-gradient(135deg,#FFEDE6 0px,#FFEDE6 12px,#FFF4EE 12px,#FFF4EE 24px)}
  .stripe-dark{background-image:repeating-linear-gradient(135deg,#1A1A1A 0px,#1A1A1A 14px,#262626 14px,#262626 28px)}
</style>
</helmet>

<div style="max-width:1280px;margin:0 auto;padding:24px 32px 100px">

  <div style="display:flex;align-items:center;gap:2px;padding:8px 10px 8px 16px;background:#fff;border:1px solid #E6E2DC;border-radius:999px;margin-bottom:28px;flex-wrap:wrap;row-gap:6px">
    <a href="London Office.dc.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;margin-right:8px;flex-shrink:0">
      <svg width="26" height="26" viewBox="0 0 26 26">
        <circle cx="13" cy="3.2" r="2.6" fill="#C4471F"></circle><circle cx="13" cy="22.8" r="2.6" fill="#C4471F"></circle>
        <circle cx="3.2" cy="13" r="2.6" fill="#C4471F"></circle><circle cx="22.8" cy="13" r="2.6" fill="#C4471F"></circle>
        <circle cx="6" cy="6" r="2.3" fill="#C4471F" opacity="0.85"></circle><circle cx="20" cy="20" r="2.3" fill="#C4471F" opacity="0.85"></circle>
        <circle cx="6" cy="20" r="2.3" fill="#C4471F" opacity="0.85"></circle><circle cx="20" cy="6" r="2.3" fill="#C4471F" opacity="0.85"></circle>
        <circle cx="13" cy="13" r="3.2" fill="#C4471F"></circle>
      </svg>
      <div style="font:800 12.5px/1.15 Inter,sans-serif;color:#C4471F;white-space:nowrap">Vandelay<br>Industries</div>
    </a>
    <a href="#" style="display:flex;align-items:center;gap:5px;padding:7px 11px;border-radius:999px;font:600 13.5px Inter,sans-serif;color:#000000;text-decoration:none;white-space:nowrap" style-hover="background:#FFF4EF">News <span style="background:#FFEDE6;color:#C4471F;font:700 11px Inter,sans-serif;border-radius:999px;padding:1px 7px;line-height:1.4">2</span></a>
    <a href="Social Hub.dc.html" style="display:flex;align-items:center;padding:7px 11px;border-radius:999px;font:600 13.5px Inter,sans-serif;color:#000000;text-decoration:none;white-space:nowrap" style-hover="background:#FFF4EF">Social Hub</a>
    <a href="#" style="display:flex;align-items:center;padding:7px 11px;border-radius:999px;font:600 13.5px Inter,sans-serif;color:#000000;text-decoration:none;white-space:nowrap" style-hover="background:#FFF4EF">Departments</a>
    <a href="London Office.dc.html" style="display:flex;align-items:center;padding:7px 11px;border-radius:999px;font:700 13.5px Inter,sans-serif;color:#C4471F;text-decoration:none;background:#FFEDE6;white-space:nowrap" style-hover="background:#FFD9C9">London Office</a>
    <a href="Events Hub.dc.html" style="display:flex;align-items:center;padding:7px 11px;border-radius:999px;font:600 13.5px Inter,sans-serif;color:#000000;text-decoration:none;white-space:nowrap" style-hover="background:#FFF4EF">Events</a>
    <div style="display:flex;align-items:center;gap:10px;margin-left:auto;padding-right:4px;flex-shrink:0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
      <div style="position:relative;display:flex">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H8l-4 4V6a2 2 0 012-2h13a2 2 0 012 2v9z"></path></svg>
        <span style="position:absolute;top:-7px;right:-8px;background:#FFEDE6;color:#C4471F;font:700 9px Inter,sans-serif;border-radius:999px;padding:1px 5px">2</span>
      </div>
      <div style="position:relative;display:flex">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 01-3.4 0"></path></svg>
        <span style="position:absolute;top:-7px;right:-8px;background:#FFEDE6;color:#C4471F;font:700 9px Inter,sans-serif;border-radius:999px;padding:1px 5px">2</span>
      </div>
      <div style="display:flex;border:1px solid #E6E2DC;border-radius:999px;overflow:hidden;font:600 12px Inter,sans-serif">
        <span style="padding:6px 10px;background:#FFEDE6;color:#000000">EN</span>
        <span style="padding:6px 10px;color:#767676">FR</span>
      </div>
      <div style="display:flex;align-items:center;gap:4px;cursor:pointer">
        <div style="width:28px;height:28px;border-radius:50%;background:#FFA36F"></div>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#4D4D4D" stroke-width="2"><path d="M6 9l6 6 6-6"></path></svg>
      </div>
    </div>
  </div>

  <div style="position:relative;border-radius:20px;overflow:hidden;height:400px;display:flex;align-items:flex-end;padding:36px">
    <img src="uploads/London office.avif" alt="London Office" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,0.55) 100%)"></div>
    <h1 style="position:relative;z-index:1;font:800 48px Inter,sans-serif;color:#fff;margin:0">London Office</h1>
  </div>

  <div style="display:flex;gap:32px;margin-top:40px;align-items:flex-start">
    <div style="flex:1;min-width:0">
      <h2 style="font:800 22px Inter,sans-serif;color:#000000;margin:0 0 18px">My Location &amp; Me</h2>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px">
        <sc-for list="{{ tiles }}" as="tile" hint-placeholder-count="6">
          <a href="{{ tile.href }}" style="display:block;border:1px solid #E6E2DC;border-radius:16px;overflow:hidden;background:#fff">
            <div class="stripe" style="position:relative;aspect-ratio:4/3">
              <sc-if value="{{ tile.photo }}" hint-placeholder-val="false"><img src="{{ tile.photo }}" alt="{{ tile.label }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></sc-if>
              <sc-if value="{{ tile.noPhoto }}" hint-placeholder-val="false"><span style="position:absolute;bottom:8px;right:10px;font:500 10px 'IBM Plex Mono',monospace;color:#A8877A">{{ tile.photoLabel }}</span></sc-if>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px">
              <span style="font:700 15px Inter,sans-serif;color:#000000">{{ tile.label }}</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#767676" stroke-width="2"><path d="M9 6l6 6-6 6"></path></svg>
            </div>
          </a>
        </sc-for>
      </div>
    </div>

    <div style="width:340px;flex-shrink:0;display:flex;flex-direction:column;gap:28px">
      <div>
        <h2 style="font:800 22px Inter,sans-serif;color:#000000;margin:0 0 18px">Need help?</h2>
        <div style="background:#FFEDE6;border-radius:16px;padding:18px;display:flex;align-items:center;gap:14px;margin-bottom:16px">
          <div style="width:48px;height:48px;border-radius:50%;background:#FFA36F;flex-shrink:0"></div>
          <div>
            <div style="font:700 15px Inter,sans-serif;color:#000000">Tom Mitchel</div>
            <div style="font:500 13px Inter,sans-serif;color:#4D4D4D">Office Manager</div>
            <a href="#" onClick="{{ noop }}" style="font:600 13px Inter,sans-serif">Get in touch</a>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
          <sc-for list="{{ helpTiles }}" as="h" hint-placeholder-count="6">
            <div style="border:1px solid #E6E2DC;border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
              <div style="{{ h.iconWrapStyle }}">
                <sc-if value="{{ h.isAma }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF6840" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 115 .5c0 1.5-2.5 2-2.5 3.5"></path><path d="M12 17h.01"></path></svg></sc-if>
                <sc-if value="{{ h.isDirectory }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 8h6M9 12h6"></path></svg></sc-if>
                <sc-if value="{{ h.isJobs }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B5762A" stroke-width="2"><rect x="3" y="8" width="18" height="12" rx="2"></rect><path d="M8 8V6a2 2 0 012-2h4a2 2 0 012 2v2"></path></svg></sc-if>
                <sc-if value="{{ h.isOkrs }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F6FE0" stroke-width="2"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle></svg></sc-if>
                <sc-if value="{{ h.isHandbook }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F9E5C" stroke-width="2"><path d="M4 5a2 2 0 012-2h11v18H6a2 2 0 01-2-2V5z"></path><path d="M17 3v18"></path></svg></sc-if>
                <sc-if value="{{ h.isItHelp }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg></sc-if>
              </div>
              <span style="font:600 12px Inter,sans-serif;color:#000000">{{ h.label }}</span>
            </div>
          </sc-for>
        </div>
      </div>

      <div>
        <h2 style="font:800 22px Inter,sans-serif;color:#000000;margin:0 0 18px">Upcoming events</h2>
        <div style="display:flex;flex-direction:column;gap:10px">
          <dc-import name="EventCard" variant="horizontal" title="All-Hands: Q3 Product Roadmap" event-id="all-hands-q3" date-label="Thu, Aug 14 · 10:00 AM" location-type="in-person" location-text="London Office, 4th Floor" rsvp-style="dropdown" attendee-count="128" thumbnail="uploads/product all hands.avif" on-open="{{ goToAllHands }}" hint-size="100%,116px"></dc-import>
          <dc-import name="EventCard" variant="horizontal" title="Product Launch: Connected Kitchen Collection" event-id="connected-kitchen-launch" date-label="Fri, Aug 22 · 5:30 PM" location-type="in-person" location-text="London Office Rooftop" rsvp-style="dropdown" attendee-count="33" thumbnail="uploads/kitchen.avif" on-open="{{ goToRooftop }}" hint-size="100%,116px"></dc-import>
          <dc-import name="EventCard" variant="horizontal" title="AI Training - Module 1" event-id="ai-training-module-1" date-label="Wed, Aug 27 · 1:00 PM" location-type="online" online-label="Join via Zoom" rsvp-style="dropdown" attendee-count="31" thumbnail="uploads/ai training.avif" hint-size="100%,116px"></dc-import>
        </div>
        <a href="Events Hub.dc.html" style="display:block;margin-top:12px;font:600 13px Inter,sans-serif">See all events →</a>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const iconWrap = (bg) => ({ width: '34px', height: '34px', borderRadius: '10px', background: bg, display: 'flex', alignItems: 'center', justifyContent: 'center' });
    return {
      noop: (e) => e.preventDefault(),
      goToAllHands: () => { window.location.href = 'Event Details.dc.html'; },
      goToRooftop: () => { window.location.href = 'Event Details - Rooftop Social.dc.html'; },
      tiles: [
        { label: 'My Workplace', photo: 'uploads/my workplace.avif', href: '#' },
        { label: 'Meeting Room Booking', photo: 'uploads/meeting room booking.avif', href: '#' },
        { label: 'ERGs\n', photo: 'uploads/erg.avif', href: 'Events Hub.dc.html' },
        { label: 'IT Help', photo: 'uploads/iT.avif', href: '#' },
        { label: 'Team Directory', photo: 'uploads/team directory.avif', href: '#' },
        { label: 'Office Kitchen', photo: 'uploads/kitchen.avif', href: '#' },
      ],
      helpTiles: [
        { label: 'AMA', iconWrapStyle: iconWrap('#FFEDE6'), isAma: true },
        { label: 'Directory', iconWrapStyle: iconWrap('#FF6840'), isDirectory: true },
        { label: 'Job Board', iconWrapStyle: iconWrap('#FDEEDB'), isJobs: true },
        { label: 'OKRs', iconWrapStyle: iconWrap('#E5F0FF'), isOkrs: true },
        { label: 'Handbook', iconWrapStyle: iconWrap('#E3F7EA'), isHandbook: true },
        { label: 'IT Help', iconWrapStyle: iconWrap('#FDEEDB'), isItHelp: true },
      ],
    };
  }
}

</script>
</body>
</html>
